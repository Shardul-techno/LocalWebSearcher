[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lre"
version = "0.1.0"
description = "Passage-first local web research"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "trafilatura>=1.12", "ddgs>=9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires network access"]
