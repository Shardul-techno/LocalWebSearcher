[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lre"
dynamic = ["version"]
description = "Passage-first local web research"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "trafilatura>=1.12", "ddgs>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lre._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-m", "not integration", "--basetemp=.pytest-tmp"]
markers = ["integration: requires network access"]
