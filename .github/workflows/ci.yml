name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set up environment (Windows documented command)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup.ps1
      - name: Set up environment (Linux CI equivalent)
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt -r requirements-dev.lock.txt
          python -m pip install -e .
      - name: Test
        run: .venv/Scripts/python.exe -m pytest -q
        if: runner.os == 'Windows'
      - name: Test
        run: .venv/bin/python -m pytest -q
        if: runner.os != 'Windows'
      - name: Offline self-test
        run: .venv/Scripts/python.exe -m lre selftest
        if: runner.os == 'Windows'
      - name: Offline self-test
        run: .venv/bin/python -m lre selftest
        if: runner.os != 'Windows'

  fresh-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Documented developer setup
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup.ps1

  windows-package:
    runs-on: windows-latest
    needs: [test, fresh-setup]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup.ps1
      - shell: pwsh
        run: choco install innosetup -y --no-progress
      - shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1
      - name: Silent install, installed selftest, uninstall
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "from lre._version import __version__; print(__version__)"
          $setup = ".\dist\LocalResearch-Setup-$version.exe"
          $dir = Join-Path $env:RUNNER_TEMP "LocalResearch-install"
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$dir"
          if ($LASTEXITCODE -ne 0) { throw "Silent installer failed with exit $LASTEXITCODE" }
          & "$dir\lre.exe" selftest
          if ($LASTEXITCODE -ne 0) { throw "Installed lre.exe selftest failed" }
          & "$dir\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Silent uninstall failed with exit $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalResearch-Windows
          path: |
            dist/LocalResearch-Setup-*.exe
            dist/LocalResearch-*-portable.zip
            dist/SHA256SUMS.txt
