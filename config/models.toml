[managed-local]
backend = "llamacpp_managed"
base_url = "http://127.0.0.1:0/v1"
model = "local-gguf"
num_ctx = 4096
threads = 6
temperature = 0.1
max_tokens = 300
timeout_seconds = 120
supports_json_schema = false
think = false

[qwen-small]
backend = "ollama"
base_url = "http://localhost:11434"
model = "qwen3.5:0.8b"
num_ctx = 4096
temperature = 0.1
max_tokens = 300
timeout_seconds = 120
supports_json_schema = true
think = false

